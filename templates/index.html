<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload to Database</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .box {
        background: #1f2937;
        padding: 24px;
        border-radius: 14px;
        width: min(560px, 90%);
      }
      button {
        margin-top: 12px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Upload a photo</h2>
      <p>Your uploaded file will be saved into a local database.</p>
      <form method="post" enctype="multipart/form-data">
        <input type="file" name="photo" accept="image/*" required />
        <br />
        <button type="submit">Upload</button>
      </form>
    </div>
  </body>
</html>
